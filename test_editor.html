<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Éditeur</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
    button { padding: 10px 20px; margin: 10px; }
    #status { color: #666; }
    #pdf { width: 100%; height: 400px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Test Éditeur PDF</h1>
  
  <div class="test-section">
    <h2>Test de génération PDF</h2>
    <button onclick="testPdf()">Tester PDF</button>
    <div id="status">Prêt</div>
  </div>
  
  <div class="test-section">
    <h2>Prévisualisation PDF</h2>
    <iframe id="pdf"></iframe>
  </div>

  <script>
    async function testPdf() {
      const statusEl = document.getElementById('status');
      const pdfEl = document.getElementById('pdf');
      
      try {
        statusEl.textContent = 'Génération du PDF...';
        
        const res = await fetch('/editor/preview-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            markdown: `---
title: Test PDF
footer: Test Footer
---

# Test de génération PDF

Ceci est un test de génération PDF.

## Section 1
Contenu de test.

## Section 2
Autre contenu.` 
          })
        });
        
        if (!res.ok) {
          const errorText = await res.text();
          throw new Error(`Erreur serveur (${res.status}): ${errorText}`);
        }
        
        const blob = await res.blob();
        console.log('Blob reçu:', blob.size, 'bytes');
        
        if (blob.size === 0) {
          throw new Error('PDF vide reçu du serveur');
        }
        
        // Libérer l'ancienne URL si elle existe
        if (pdfEl.src && pdfEl.src.startsWith('blob:')) {
          URL.revokeObjectURL(pdfEl.src);
        }
        
        const url = URL.createObjectURL(blob);
        pdfEl.src = url;
        statusEl.textContent = `PDF généré avec succès (${blob.size} bytes)`;
        
      } catch (error) {
        console.error('Erreur:', error);
        statusEl.textContent = `Erreur: ${error.message}`;
      }
    }
  </script>
</body>
</html>
