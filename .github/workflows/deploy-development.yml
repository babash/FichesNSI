name: Deploy Development

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  deploy-development:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate and test static site with PDFs
      run: |
        # Générer le site statique avec PDFs
        node scripts/generate-static.js
        
        # Vérifier que les fichiers ont été générés
        if [ ! -f "dist/index.html" ]; then
          echo "❌ index.html non généré"
          exit 1
        fi
        
        if [ ! -f "dist/css/fiche-nsi.css" ]; then
          echo "❌ CSS non généré"
          exit 1
        fi
        
        if [ ! -f "dist/fiches/liste/index.html" ]; then
          echo "❌ Fiches HTML non générées"
          exit 1
        fi
        
        # Vérifier que les PDFs ont été générés
        if [ ! -f "dist/fiches/liste.pdf" ]; then
          echo "❌ PDFs non générés"
          exit 1
        fi
        
        if [ ! -f "dist/fiches/all.pdf" ]; then
          echo "❌ PDF combiné non généré"
          exit 1
        fi
        
        echo "✅ Site statique avec PDFs généré avec succès"
        echo "📁 Fichiers générés:"
        find dist -type f | head -15
        echo "📄 PDFs générés:"
        ls -la dist/fiches/*.pdf
        
    - name: Deploy to development
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages-dev
        destination_dir: dev
        
    - name: Notify deployment success
      if: success()
      run: |
        echo "🎉 Déploiement en développement réussi !"
        echo "🌐 Site de développement disponible à :"
        echo "   https://babash.github.io/FichesNSI/dev/"
        echo ""
        echo "📋 **Tests effectués :**"
        echo "- ✅ Site statique généré"
        echo "- ✅ CSS et JS chargés"
        echo "- ✅ PDFs générés et valides"
        echo "- ✅ Déploiement sur gh-pages-dev réussi"