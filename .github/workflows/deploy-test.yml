name: Deploy Test Branch

on:
  push:
    branches: [ test/* ]
  pull_request:
    branches: [ test/* ]

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate and test static site
      run: |
        # Générer le site statique
        node scripts/generate-static.js
        
        # Vérifier que les fichiers ont été générés
        if [ ! -f "dist/index.html" ]; then
          echo "❌ index.html non généré"
          exit 1
        fi
        
        if [ ! -f "dist/css/fiche-nsi.css" ]; then
          echo "❌ CSS non généré"
          exit 1
        fi
        
        if [ ! -f "dist/fiches/liste/index.html" ]; then
          echo "❌ Fiches non générées"
          exit 1
        fi
        
        echo "✅ Site statique généré avec succès"
        echo "📁 Fichiers générés:"
        find dist -type f | head -10
        
    - name: Deploy test branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages-test
        destination_dir: ${{ github.ref_name }}
        
    - name: Comment PR with preview link
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const branchName = context.payload.pull_request.head.ref;
          const previewUrl = `https://babash.github.io/FichesNSI/${branchName}/`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **Preview déployé !**\n\nVotre branche de test est maintenant disponible à l'adresse :\n${previewUrl}\n\n📋 **Tests effectués :**\n- ✅ Serveur démarre correctement\n- ✅ Pages principales accessibles\n- ✅ Génération PDF fonctionnelle\n- ✅ PDF valide et non corrompu`
          });