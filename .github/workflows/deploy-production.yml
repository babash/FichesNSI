name: Deploy Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate static site with PDFs
      run: |
        # Générer le site statique avec PDFs
        node scripts/generate-static.js
        
        # Vérifier que les fichiers ont été générés
        if [ ! -f "dist/index.html" ]; then
          echo "❌ index.html non généré"
          exit 1
        fi
        
        if [ ! -f "dist/css/fiche-nsi.css" ]; then
          echo "❌ CSS non généré"
          exit 1
        fi
        
        if [ ! -f "dist/fiches/liste/index.html" ]; then
          echo "❌ Fiches HTML non générées"
          exit 1
        fi
        
        # Vérifier que les PDFs ont été générés
        if [ ! -f "dist/fiches/liste.pdf" ]; then
          echo "❌ PDFs non générés"
          exit 1
        fi
        
        if [ ! -f "dist/fiches/all.pdf" ]; then
          echo "❌ PDF combiné non généré"
          exit 1
        fi
        
        echo "✅ Site statique avec PDFs généré avec succès"
        echo "📁 Fichiers générés:"
        find dist -type f | head -15
        echo "📄 PDFs générés:"
        ls -la dist/fiches/*.pdf
        
    - name: Deploy to production
      run: |
        # Créer le dossier docs s'il n'existe pas
        mkdir -p docs
        
        # Copier le contenu de dist vers docs
        cp -r dist/* docs/
        
        # Ajouter .nojekyll pour désactiver Jekyll
        touch docs/.nojekyll
        
        # Commiter et pousser les changements
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/
        git commit -m "Deploy static site to docs/ folder
        
        - Generated from commit ${{ github.sha }}
        - All CSS, JS, HTML, and PDF files included
        - Site ready for GitHub Pages hosting"
        git push
        
    - name: Notify deployment success
      if: success()
      run: |
        echo "🎉 Déploiement en production réussi !"
        echo "🌐 Site disponible sur: https://babash.github.io/FichesNSI/"
        echo "📋 Tests validés:"
        echo "  - ✅ Serveur fonctionnel"
        echo "  - ✅ Toutes les pages accessibles"
        echo "  - ✅ Génération PDF individuelle"
        echo "  - ✅ Génération PDF complète"
        echo "  - ✅ PDFs valides et de taille correcte"