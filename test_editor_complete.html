<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Éditeur Complet</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { display: flex; gap: 20px; }
    .editor-pane { flex: 1; }
    .preview-pane { flex: 1; }
    textarea { width: 100%; height: 300px; font-family: monospace; }
    iframe { width: 100%; height: 400px; border: 1px solid #ccc; }
    button { padding: 10px 20px; margin: 10px; }
    .status { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Test Éditeur Complet</h1>
  
  <div class="container">
    <div class="editor-pane">
      <h2>Éditeur Markdown</h2>
      <textarea id="editor" placeholder="Tapez votre markdown ici...">---
title: Test PDF
footer: Test Footer
---

# Test de génération PDF

Ceci est un test de génération PDF.

## Section 1
Contenu de test.

## Section 2
Autre contenu.</textarea>
      <br>
      <button onclick="testPdf()">Tester PDF</button>
      <button onclick="startAutoPreview()">Démarrer Auto-preview</button>
      <div class="status" id="status">Prêt</div>
    </div>
    
    <div class="preview-pane">
      <h2>Prévisualisation PDF</h2>
      <iframe id="pdf"></iframe>
    </div>
  </div>

  <script>
    const editorEl = document.getElementById('editor');
    const pdfEl = document.getElementById('pdf');
    const statusEl = document.getElementById('status');
    
    function setStatus(msg) { 
      statusEl.textContent = msg;
      console.log('📊 Status:', msg);
    }

    async function fetchPdf(markdown) {
      setStatus('Génération du PDF…');
      try {
        console.log('🔄 Début génération PDF...');
        const res = await fetch('/editor/preview-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ markdown })
        });
        
        console.log('📊 Réponse reçue:', res.status, res.statusText);
        
        if (!res.ok) {
          const errorText = await res.text();
          console.error('❌ Erreur serveur:', errorText);
          throw new Error(`Erreur serveur (${res.status}): ${errorText}`);
        }
        
        const blob = await res.blob();
        console.log('📄 Blob reçu:', blob.size, 'bytes, type:', blob.type);
        
        if (blob.size === 0) {
          throw new Error('PDF vide reçu du serveur');
        }
        
        // Libérer l'ancienne URL si elle existe
        if (pdfEl.src && pdfEl.src.startsWith('blob:')) {
          URL.revokeObjectURL(pdfEl.src);
        }
        
        const url = URL.createObjectURL(blob);
        console.log('🔗 URL blob créée:', url);
        pdfEl.src = url;
        
        // Attendre que l'iframe se charge
        pdfEl.onload = () => {
          console.log('✅ PDF chargé dans l\'iframe');
          setStatus('A jour');
        };
        
        pdfEl.onerror = () => {
          console.error('❌ Erreur chargement PDF dans iframe');
          setStatus('Erreur: Impossible de charger le PDF');
        };
        
      } catch (error) {
        console.error('❌ Erreur fetchPdf:', error);
        setStatus(`Erreur: ${error.message}`);
      }
    }

    function testPdf() {
      fetchPdf(editorEl.value);
    }

    let autoPreviewTimer = null;
    function startAutoPreview() {
      if (autoPreviewTimer) {
        clearInterval(autoPreviewTimer);
        autoPreviewTimer = null;
        setStatus('Auto-preview arrêté');
        return;
      }
      
      setStatus('Auto-preview démarré');
      autoPreviewTimer = setInterval(() => {
        fetchPdf(editorEl.value);
      }, 2000);
    }

    // Test initial
    setTimeout(() => {
      console.log('🚀 Test initial...');
      testPdf();
    }, 1000);
  </script>
</body>
</html>
